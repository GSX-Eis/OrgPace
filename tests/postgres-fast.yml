services:
  db:
    # postgres:18 mounts the versioned PGDATA directory under this parent.
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_wal_size=2GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 1s
      start_period: 1s
      timeout: 5s
      retries: 30
