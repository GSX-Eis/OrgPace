name: pre-commit

on:
  pull_request:
  push:
    branches: [master, dev]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: cp .env.example .env
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          cache-dependency-glob: |
            requirements**.txt
            pyproject.toml
            uv.lock
      - name: Install backend dependencies
        run: uv sync --all-packages
      - name: Install frontend dependencies
        run: bun ci
      - name: Run prek - pre-commit
        id: precommit
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          elif [[ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "${GITHUB_EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$GITHUB_EVENT_BEFORE"
          elif git cat-file -e "HEAD~1^{commit}" 2>/dev/null; then
            base="HEAD~1"
          else
            uv run prek run --all-files --show-diff-on-failure
            exit
          fi
          uv run prek run --from-ref "$base" --to-ref HEAD --show-diff-on-failure
