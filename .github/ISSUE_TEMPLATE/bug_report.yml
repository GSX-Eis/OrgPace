name: Bug Report
description: Report a reproducible bug or unexpected behavior in OrgPace.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify it has not already been reported, and **never paste API keys, `.env` secrets, or real employee data**.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker Compose (Quick Start / .env.example)
        - Production Installer (./install.sh)
        - Local Development Server
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Start the stack with ...
        2. Navigate to ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Environment
      description: OS, Docker/Compose version, browser, and redacted error logs (strip any tokens or personal data).
      render: text
